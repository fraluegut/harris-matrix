[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harris-matrix"
version = "0.1.0"
description = "Record, verify and draw archaeological stratigraphy (excavation and standing-buildings archaeology) as Harris matrices."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Francisco Javier Luengo Gutiérrez", email = "javierluengogutierrez@gmail.com" }]
keywords = ["archaeology", "harris matrix", "stratigraphy", "building archaeology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
harris-matrix = "harris_matrix.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/harris_matrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
